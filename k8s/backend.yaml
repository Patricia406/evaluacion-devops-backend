apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: evaluacion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: paty123/proyecto-backend:1.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: evaluacion
spec:
  selector:
    app: backend
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000