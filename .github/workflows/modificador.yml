
name: Modificador - GitHub Actions

on:
  workflow_dispatch:
    inputs:
      recurso:
        description: "Deployment de Kubernetes"
        required: true
        type: choice
        options:
          - backend
      driver:
        description: "Base de datos"
        required: true
        type: choice
        options:
          - postgres
          - mysql
          - mongo

jobs:
  modificar:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Verificar conexion con Kubernetes
        shell: powershell
        run: |
          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) {
            throw "No se puede conectar a Kubernetes"
          }

      - name: Cambiar base de datos
        shell: powershell
        env:
          RECURSO: ${{ inputs.recurso }}
          DRIVER: ${{ inputs.driver }}
        run: |
          if ($env:RECURSO -ne "backend") {
            throw "Recurso no permitido"
          }

          switch ($env:DRIVER) {
            "postgres" {
              $dbHost = "postgres-service"
              $dbPort = "5432"
            }
            "mysql" {
              $dbHost = "mysql-service"
              $dbPort = "3306"
            }
            "mongo" {
              $dbHost = "mongo-service"
              $dbPort = "27017"
            }
            default {
              throw "Driver no permitido"
            }
          }

          kubectl set env deployment/backend -n evaluacion `
            "MY_DATABASE_DRIVER=$env:DRIVER" `
            "DB_HOST=$dbHost" `
            "DB_PORT=$dbPort" `
            "DB_NAME=backenddb"

          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo modificar el Deployment"
          }

          kubectl rollout status deployment/backend -n evaluacion --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Fallo el despliegue"
          }

      - name: Verificar resultado
        shell: powershell
        env:
          DRIVER: ${{ inputs.driver }}
        run: |
          $actual = kubectl get deployment backend -n evaluacion -o jsonpath="{.spec.template.spec.containers[0].env[?(@.name=='MY_DATABASE_DRIVER')].value}"

          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:DRIVER) {
            throw "El driver no coincide con el solicitado"
          }

          Write-Host "Cambio exitoso. Driver activo: $actual"
          kubectl get pods -n evaluacion

          if ($LASTEXITCODE -ne 0) {
            throw "Error al consultar los pods"
          }
